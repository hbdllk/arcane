<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/card.css">
    <title>Card</title>
</head>
<body>
    <div class="card">
        <div class="card__image">
            <img src="./assets/laptops/AppleMacBookAir13.avif" alt="">
        </div>
        <div class="card__info">
            <div class="card__info-name">
                <p class="card__info-name_brand"></p>
                <h3 class="card__info-name_model"></h3>
            </div>
            <div class="card__info-rating">
                <div class="card__info-rating_stars">
                    <img src="./assets/Star.svg" alt="Star">
                    <img src="./assets/Star.svg" alt="Star">
                    <img src="./assets/Star.svg" alt="Star">
                    <img src="./assets/Star.svg" alt="Star">
                    <img src="./assets/Star.svg" alt="Star">
                </div>
                <span class="card__info-rating_reviews"></span>
            </div>
            <div class="card__info-specs">
                <span class="card__info-specs_item"></span>
                <span class="card__info-specs_item"></span>
            </div>
            <div class="card__info-price">
                <span class="card__info-price_new"></span>
                <span class="card__info-price_old"></span>
            </div>
        </div>
    </div>
</body>
</html>
